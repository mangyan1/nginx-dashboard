# A weekly clock on the one version nothing else watches.
#
# Dependabot covers package.json, the workflows and the e2e image, and it will keep covering them.
# What it cannot see is the node major `deploy/install.sh` puts on a server — that is a literal in a
# shell script, in no manifest, in no ecosystem — so it can leave support with no PR, no advisory and
# a green `api` matrix, which will happily test an EOL runtime for ever.
#
# This job is the notification that replaces the missing one: it reads node's own release schedule
# and fails once the floor is past its end-of-life date. The failure opens an issue, because a red X
# in the Actions tab only notifies someone who was already looking.
name: Version floor

on:
  schedule:
    # Mondays, 06:17 UTC. Not on the hour: a weekly job has no reason to be punctual, and the top of
    # the hour is when GitHub's own scheduler queue is longest.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  node-floor:
    name: node floor is supported
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # No `npm ci` before it: the check reads three files and node's release schedule, nothing else.
      - run: npm run test:floor
      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One issue, not one a week until someone moves the floor.
          OPEN=$(gh issue list --state open --limit 100 --json title \
            --jq 'any(.[]; .title | startswith("The node floor"))')
          if [ "$OPEN" = "true" ]; then
            echo "an issue is already open — not opening another"
            exit 0
          fi
          gh issue create \
            --title "The node floor in deploy/install.sh is out of support" \
            --body "The weekly \`version-floor\` check failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The node major that \`deploy/install.sh\` installs on a fresh server (\`NODE_MIN\`) is past its
          end-of-life date in node's own release schedule, so every new install gets an unpatched
          runtime. Nothing else here would have said so: Dependabot cannot read a shell literal, and
          the \`api\` matrix stays green on a version that is EOL.

          The fix is one coordinated change — move \`NODE_MIN\` in \`deploy/install.sh\`, raise
          \`engines.node\` in \`package.json\`, and add the new major to the \`api\` matrix in
          \`.github/workflows/ci.yml\`. The matrix is what keeps the floor honest, and the check fails
          if a floor has no leg testing it. Close this once that has merged."
